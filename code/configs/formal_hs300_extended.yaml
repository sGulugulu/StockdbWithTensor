market:
  market_id: cn_a
  universe_id: HS300
  start_date: 2015-01-01
  end_date: 2026-03-30
  timezone: Asia/Shanghai
  currency: CNY
  universe_path: ../data/formal/universes/hs300_history.csv
  universe_symbol_column: stock_code
  universe_start_column: start_date
  universe_end_column: end_date
  universe_market_column: market_id
  universe_id_column: universe_id

data:
  path: ../data/formal/factors/hs300_factor_panel_extended.csv
  format: wide
  stock_column: stock_code
  date_column: trade_date
  industry_column: industry
  return_column: future_return
  factor_columns:
    - value_factor
    - momentum_factor
    - quality_factor
    - volatility_factor
    - market_return_1d
    - market_momentum_5d
    - market_momentum_20d
    - market_volatility_20d
    - market_drawdown_20d
    - market_amount_change_5d
    - market_amount_zscore_20d
    - macro_proxy_risk_score
    - macro_proxy_liquidity_score
    - macro_policy_rate
    - macro_lpr_1y
    - macro_lpr_5y
    - macro_cpi_mom
    - macro_m2_yoy
    - macro_industrial_production_yoy
    - macro_exports_yoy
    - macro_imports_yoy
    - pit_roe_avg
    - pit_np_margin
    - pit_gp_margin
    - pit_eps_ttm
    - pit_data_age_days
    - dividend_cash_ratio
    - dividend_bonus_ratio
    - dividend_transfer_ratio
    - dividend_age_days
    - dividend_flag
    - perf_express_eps_chg_pct
    - perf_express_roe_wa
    - perf_express_gryoy
    - perf_express_opyoy
    - perf_express_age_days
    - perf_express_flag
    - forecast_direction
    - forecast_chg_pct_up
    - forecast_chg_pct_dwn
    - forecast_change_midpoint
    - forecast_change_width
    - forecast_age_days
    - event_positive_flag
    - event_negative_flag
    - event_uncertainty_score
    - event_age_decay_score
    - event_intensity_score
    - major_event_count_30d
    - major_event_severity_score_30d
    - major_event_age_days
    - major_event_flag
    - announcement_count_30d
    - announcement_keyword_score_30d
    - announcement_title_length_mean_30d
    - announcement_flag
    - forecast_flag

preprocess:
  max_missing_ratio: 0.45
  winsor_limits: [0.05, 0.95]
  fill_strategy: forward_backward_industry_median
  standardize_method: winsorize_zscore

split:
  strategy: time
  train_ratio: 0.6
  validation_ratio: 0.2
  test_ratio: 0.2

models:
  seed: 7
  cp:
    enabled: true
    ranks: [2, 3]
    max_iter: 75
    tol: 1.0e-6
  tucker:
    enabled: true
    ranks:
      - [2, 2, 2]
      - [3, 2, 2]
    max_iter: 20
    tol: 1.0e-6
  pca:
    enabled: true
    ranks: [2, 3]

evaluation:
  top_k_pairs: 5
  rolling_window: 3
  quantile_count: 5
  transaction_cost_bps: 10.0
  benchmark_path: ../data/formal/index_daily/hs300_index_daily.csv

runtime:
  selection_top_n: 20
  device: auto

output:
  root_dir: ../outputs
  experiment_name: formal_hs300_extended_run
